<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartão Fidelidade Digital</title>
  <link rel="icon" type="fran.png" href="fran.png">
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <div class="container" style="max-width: 480px;">
    
    <!-- TELA 1: Cadastro do Cliente -->
    <section id="screen-login" class="card shadow-sm p-4 screen active border-0 rounded-4">
        <div class="mb-3">
            <img src="fran.png" alt="Logo da Empresa" class="img-fluid rounded-circle shadow-sm" style="width: 80px; height: 80px; object-fit: cover;">
        </div>

      <h2 class="h4 mb-2 text-pink-dark fw-bold">💖 Bem-vindo(a) ao seu cartão fidelidade da Fran 💖</h2>
      <p class="text-muted small mb-4">Antes de começar, me fala quem é você?</p>
      
      <form id="form-login">
        <div class="mb-3">
          <label for="client-name" class="form-label fw-semibold small">Nome Completo</label>
          <input type="text" id="client-name" class="form-control" required placeholder="Ex: Maria Silva">
        </div>
        <div class="mb-4">
          <label for="client-phone" class="form-label fw-semibold small">Telefone (WhatsApp)</label>
          <input type="tel" id="client-phone" class="form-control" required placeholder="(11) 99999-9999">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Acessar Cartão</button>
      </form>
      
      <button id="btn-admin-access" class="btn btn-link text-decoration-none text-secondary mt-3 w-100 small">Sou a Dona!</button>
    </section>

    <!-- TELA 2: Cartão Fidelidade e Registro de Compra -->
    <section id="screen-card" class="card shadow-sm p-4 screen border-0 rounded-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 id="display-client-name" class="h5 fw-bold text-dark m-0">Olá!</h2>
        <button id="btn-logout" class="btn btn-outline-danger btn-sm">Sair</button>
      </div>

      <div class="my-3">
        <h3 class="h6 fw-bold text-secondary">Seus Carimbos</h3>
        <div id="stamp-grid" class="stamp-grid">
          <!-- 10 espaços para carimbo gerados pelo layout -->
          <div class="stamp-slot" data-index="1">1</div>
          <div class="stamp-slot" data-index="2">2</div>
          <div class="stamp-slot" data-index="3">3</div>
          <div class="stamp-slot" data-index="4">4</div>
          <div class="stamp-slot" data-index="5">5</div>
          <div class="stamp-slot" data-index="6">6</div>
          <div class="stamp-slot" data-index="7">7</div>
          <div class="stamp-slot" data-index="8">8</div>
          <div class="stamp-slot" data-index="9">9</div>
          <div class="stamp-slot" data-index="10">10</div>
        </div>
      </div>

      <hr class="my-4 text-muted">

      <h3 class="h6 fw-bold text-secondary mb-3">Registrar Nova Compra</h3>
      <form id="form-stamp">
        <div class="mb-3">
          <label for="purchase-date" class="form-label fw-semibold small">Data da Compra</label>
          <input type="date" id="purchase-date" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="purchase-item" class="form-label fw-semibold small">O que você comprou?</label>
          <input type="text" id="purchase-item" class="form-control" required placeholder="Ex: Café Especial + Croissant">
        </div>
        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Obter Carimbo</button>
      </form>

      <button id="btn-share-whatsapp" class="btn btn-dark w-100 mt-3 py-2 fw-semibold">📱 Enviar Comprovante via WhatsApp</button>
      <button id="btn-reset-client-card" class="btn btn-outline-danger w-100 mt-2 py-1 small">🔄 Iniciar Nova Cartela (Zerar Carimbos)</button>
    </section>

    <!-- TELA 3: Painel Administrativo -->
    <section id="screen-admin" class="card shadow-sm p-4 screen border-0 rounded-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 fw-bold text-dark m-0">Painel do Administrador</h2>
        <button id="btn-admin-logout" class="btn btn-outline-secondary btn-sm">Voltar</button>
      </div>
      <p class="text-muted small mb-3">Histórico de acessos e carimbos registrados:</p>
      
      <div class="table-responsive" style="max-height: 320px;">
        <table class="table table-striped table-hover table-bordered align-middle fs-7" style="font-size: 0.85rem;">
          <thead class="table-dark">
            <tr>
              <th>Data/Hora</th>
              <th>Cliente</th>
              <th>Telefone</th>
              <th>Item</th>
              <th>Data Compra</th>
            </tr>
          </thead>
          <tbody id="admin-log-body">
            <!-- Linhas inseridas via JS -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
